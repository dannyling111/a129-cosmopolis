name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# 🔴 为什么改成官方 Actions 部署(2026-09-09):
#   原来只用 peaceiris 把仓库根镜像到 gh-pages 分支。实测:13:25 那次 push 之后
#   gh-pages 分支确实更新到了新版(API 查得到 studio.html),但线上仍然停在 09:54 那一版
#   ——也就是说这个仓库的 Pages【没有在跟 gh-pages 分支】,镜像了也不会上线。
#   更早那次官方部署失败的原因是 configure-pages 用了 enablement: false 而当时 Pages 还没开通,
#   所以这里把它改成 true:由工作流自己开通并配置成「用 Actions 构建」,不再依赖仓库设置里那个开关。
#   gh-pages 镜像仍然保留(与其它 a129 仓库一致、也当一份可直接看的快照),但它不再是上线路径。

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:                      # 保留:把仓库根镜像一份到 gh-pages 分支(快照/沿用旧约定)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,.github/**'

  # 🔴 这一条【现在必然失败,但故意留着】——原因写在下面,别当成坏掉的 CI 删掉:
  #   实测 deploy-pages@v4 报 `Failed to create deployment (status: 404)
  #   Ensure GitHub Pages has been enabled`,configure-pages 也 CREATE 不出来
  #   (Resource not accessible by integration)。工作流令牌开不了 Pages 这个口子,
  #   只有仓库拥有者能在 Settings → Pages 里选一次来源。三种选法都能立刻生效,因为
  #   main 根目录和 gh-pages 分支【现在都已经是完整站点】:
  #     · Source = GitHub Actions            → 这一条 deploy 作业立刻开始工作
  #     · Source = Deploy from a branch: gh-pages / (root)
  #     · Source = Deploy from a branch: main / (root)
  #   选好之后把 continue-on-error 去掉即可。
  deploy:
    continue-on-error: true    # 见上:等仓库设置里选一次来源,选完删掉这一行
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 备好要发的目录(排掉 .git/.github,其余整份发)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          test -f _site/index.html && test -f _site/studio.html
          test -f _site/engine/index.mjs && test -f _site/vendor/three.module.js
          echo "将要发布的文件数: $(find _site -type f | wc -l)"
      # 🔴 不调 actions/configure-pages:实测它在这个仓库上 GET Pages 站点报 404、
      #    CREATE 又报「Resource not accessible by integration」——工作流令牌开不了这个口子。
      #    但 Pages 本身是开着的(线上一直能打开首页),所以直接上传产物 + 部署即可,
      #    configure-pages 本来就只在需要 Jekyll/base-path 或需要现开通时才必需。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
